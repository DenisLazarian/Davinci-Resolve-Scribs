<!doctype html>
<title>Hello from Flask</title>
{% if person %}
  <h1>Hello {{ person.name }}!</h1>
  <h1>Age {{ person.age }}!</h1>
{% else %}
  <h1>Hello, World!</h1>
{% endif %}
